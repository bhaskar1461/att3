events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real Visitor IP Restoration from Cloudflare Edge & Cloudflare Tunnel
    # Restores $remote_addr to CF-Connecting-IP so that rate limits and audit logs key on the actual student IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.17.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Map device identifier (sent by PWA) or fallback to remote IP for auth rate limiting
    # This prevents all students in a classroom on the same campus Wi-Fi NAT IP from sharing the same lockout bucket!
    map $http_x_device_public_id $auth_rate_key {
        ""      $remote_addr;
        default $http_x_device_public_id;
    }

    # Map authorization header or device key for general API traffic
    map $http_authorization $api_rate_key {
        ""      $auth_rate_key;
        default $http_authorization;
    }

    # Slowloris & Resource Exhaustion Mitigations
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Rate Limiting Zones: Protects authentication per device/client, preventing classroom Wi-Fi NAT lockouts (AM-200)
    limit_req_zone $auth_rate_key zone=auth_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=10r/s;
    limit_req_zone $api_rate_key zone=api_limit:10m rate=60r/s;
    limit_req_status 429;

    # Custom 429 JSON Response with Retry-After Header
    error_page 429 = @rate_limited;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name ather-os.de5.net;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block - SNIST AI QR Attendance & ERP System
    server {
        listen 443 ssl;
        server_name ather-os.de5.net;

        ssl_certificate /etc/letsencrypt/live/ather-os.de5.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ather-os.de5.net/privkey.pem;

        # SSL security optimizations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Defensive Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Custom 429 Error Handler returning structured JSON with Retry-After
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header X-Retry-After-Seconds 5 always;
            return 429 '{"status":"ERROR","detail":"Too many requests. Please wait 5 seconds before retrying.","retry_after_seconds":5}';
        }

        # Disable cache on HTML to always serve latest frontend bundle
        location ~* (\.html|/|manifest\.webmanifest)$ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Disable cache on service worker files
        location ~* (sw\.js|registerSW\.js)$ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Dedicated classroom scan burst endpoint: 200 students in 10s on shared campus Wi-Fi (AM-200)
        location = /api/v1/student/scan-session {
            limit_req zone=scan_limit burst=220 nodelay;
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Rate-limited auth endpoint: burst=220 accommodates 200 students at class start (AM-200)
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=220 nodelay;
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Cache static immutable assets (Vite hashed bundles) for 1 year at edge & browser
        location /assets/ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Cache WASM scanner binary with authoritative application/wasm MIME type & immutable caching
        location /wasm/ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            default_type application/wasm;
            add_header Content-Type "application/wasm";
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Rate-limited API routes per user/device with fast-fail proxy timeouts and zero edge-caching
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # SNIST Attendance PWA & Static Content Reverse Proxy
        location / {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket & Streaming support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
