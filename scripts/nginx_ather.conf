events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map device identifier (sent by PWA) or fallback to remote IP for auth rate limiting
    # This prevents all students in a classroom on the same campus Wi-Fi NAT IP from sharing the same lockout bucket!
    map $http_x_device_public_id $auth_rate_key {
        default $http_x_device_public_id;
        ""      $binary_remote_addr;
    }

    # Map authorization header or device key for general API traffic
    map $http_authorization $api_rate_key {
        default $http_authorization;
        ""      $auth_rate_key;
    }

    # Rate Limiting Zones: Protects authentication per device/client, preventing classroom Wi-Fi NAT lockouts
    limit_req_zone $auth_rate_key zone=auth_limit:10m rate=30r/m;
    limit_req_zone $api_rate_key zone=api_limit:10m rate=60r/s;
    limit_req_status 429;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name ather-os.de5.net;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block - SNIST AI QR Attendance & ERP System
    server {
        listen 443 ssl;
        server_name ather-os.de5.net;

        ssl_certificate /etc/letsencrypt/live/ather-os.de5.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ather-os.de5.net/privkey.pem;

        # SSL security optimizations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Defensive Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Disable cache on HTML to always serve latest frontend bundle
        location ~* (\.html|/|manifest\.webmanifest)$ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Disable cache on service worker files
        location ~* (sw\.js|registerSW\.js)$ {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Rate-limited auth endpoint per device/user to thwart lockout attacks without choking classrooms
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate-limited API routes per user/device
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SNIST Attendance PWA & Static Content Reverse Proxy
        location / {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket & Streaming support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
