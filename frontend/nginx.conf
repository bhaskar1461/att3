server {
    listen 80;
    listen 443 ssl;
    server_name whiteleos.cc.cd *.whiteleos.cc.cd snist-attendance.isroot.in localhost;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow up to 50MB file uploads for student rosters, Excel registers, and selfies
    client_max_body_size 50M;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Automatic HTTP to HTTPS upgrade for secure browser context (Web Crypto / Device Binding)
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Serve static SPA files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Serve WASM scanner binary with authoritative application/wasm MIME type & immutable caching
    location /wasm/ {
        root /usr/share/nginx/html;
        default_type application/wasm;
        add_header Content-Type "application/wasm";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Direct download for SSL CA certificate for iOS trust installation
    location ~* ^/cert\.(pem|crt)$ {
        alias /etc/nginx/certs/cert.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'inline; filename="cert.pem"';
    }

    # Proxy API calls to FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional proxy for FastAPI Swagger docs
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
