# Podman / Podman Compose Container Specifications
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: attendance-app:latest
    container_name: attendance_system_app
    restart: always
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://demo:Admin%40321%23@seg-dev.sreenidhi.edu.in:3306/seg_demo}
    volumes:
      - ./backend/app:/app/app
      - ./frontend/dist:/app/frontend_dist
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: always
    ports:
      - "8008:8000"
    environment:
      - SECRET_KEY=8f3b2a19e5d4c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2
      - QR_SECRET_KEY=a1b2c3d4e5f678901234567890abcdef1234567890abcdef1234567890abcdef
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://demo:Admin%40321%23@seg-dev.sreenidhi.edu.in:3306/seg_demo}
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance_frontend_pwa
    restart: always
    ports:
      - "8088:80"
      - "443:443"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: attendance_ngrok_tunnel
    restart: always
    command: http frontend:80
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
